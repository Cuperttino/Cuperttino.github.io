name: Update Apple RSS and publish Cupertino

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-and-deploy.yml"
      - "scripts/fetch_apple_rss.py"

permissions:
  contents: write
  pages: write

concurrency:
  group: cupertino-rss-update
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Fetch Apple Newsroom RSS
        run: python scripts/fetch_apple_rss.py

      - name: Commit refreshed news
        run: |
          if git diff --quiet -- news.json; then
            echo "RSS content has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "chore: refresh Apple Newsroom feed"
          git push

      - name: Request GitHub Pages publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
