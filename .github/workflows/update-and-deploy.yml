name: Publicar Pomar

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"   # cada hora: refresca las noticias
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pomar-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pruebas
        run: npm test

      - name: Construir el sitio estático
        run: node scripts/build-static.mjs

      - name: Descargar noticias de los feeds
        run: node --disable-warning=ExperimentalWarning scripts/fetch-news.mjs

      - name: Localizar fotos en Wikimedia Commons
        run: node scripts/fetch-photos.mjs
        env:
          PHOTOS_FORCE: ${{ github.event_name == 'push' && '1' || '0' }}

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir el sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
